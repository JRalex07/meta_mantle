name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: https://metamantle.alex.runs-on.dev/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build and generate documentation showcase website
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --base-href /
          dart run meta_mantle:meta_mantle build --config meta_mantle.config.json --input build/web --output build/web --strict
          echo "metamantle.alex.runs-on.dev" > build/web/CNAME
          mkdir -p build/web/docs
          cp -r ../docs/* build/web/docs/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
