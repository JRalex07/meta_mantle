name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --log-opts="--all" /repo
      - name: Scan checkout files for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner /repo

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Get root dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze root package
        run: flutter analyze

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Get external consumer example dependencies
        working-directory: example/static_html_site
        run: flutter pub get

      - name: Analyze external consumer example
        working-directory: example/static_html_site
        run: flutter analyze

      - name: Run external consumer static site generation
        working-directory: example/static_html_site
        run: dart run bin/generate_site.dart

      - name: Run external consumer unit tests
        working-directory: example/static_html_site
        run: flutter test

      - name: Run all tests
        run: |
          set -o pipefail
          flutter test --reporter=expanded 2>&1 | tee test_results.log || {
            FAIL_DETAIL=$(grep -B 2 -A 8 "\[E\]" test_results.log | head -n 15 | tr -d '\r' | tr '\n' ' ' | sed 's/"//g')
            echo "::error title=Test Failure::$FAIL_DETAIL"
            echo "### ❌ Flutter Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 3 -A 25 "\[E\]" test_results.log >> $GITHUB_STEP_SUMMARY || true
            tail -n 120 test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 3 -A 25 "\[E\]" test_results.log || true
            exit 1
          }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: test_results.log
          if-no-files-found: ignore

      - name: Build example Flutter Web JavaScript release
        working-directory: example
        run: flutter build web --release

      - name: Build example Flutter Web WebAssembly release
        working-directory: example
        run: flutter build web --release --wasm

      - name: Run MetaMantle doctor
        working-directory: example
        run: dart run meta_mantle:meta_mantle doctor --config meta_mantle.config.json

      - name: Validate example configuration
        working-directory: example
        run: dart run meta_mantle:meta_mantle validate --config meta_mantle.config.json

      - name: Execute MetaMantle build-web command
        working-directory: example
        run: dart run meta_mantle:meta_mantle build-web --mode prerender --strict --release

      - name: Validate generated route-specific HTML
        working-directory: example
        run: dart run meta_mantle:meta_mantle html validate --dir build/web --strict

      - name: Validate HTML5 external standards via Nu HTML Checker
        working-directory: example
        run: dart run meta_mantle:meta_mantle html validate --dir build/web --nu-validate

      - name: Audit generated SEO and metadata report
        working-directory: example
        run: dart run meta_mantle:meta_mantle report --dir build/web

      - name: Setup Node.js for browser automation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and browser binaries
        run: |
          npm install --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      - name: Start MetaMantle preview server
        run: |
          dart run bin/meta_mantle.dart preview --config example/meta_mantle.config.json --dir example/build/web --port 8080 --no-watch &
          sleep 5

      - name: Run Playwright E2E real browser tests
        run: npx --prefix e2e playwright test --config=e2e/playwright.config.js

      - name: Upload Playwright test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload web build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts-on-failure
          path: example/build/web
          if-no-files-found: ignore

      - name: Verify package publish dry-run
        run: dart pub publish --dry-run
