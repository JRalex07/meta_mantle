name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --log-opts="--all" /repo
      - name: Scan checkout files for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner /repo

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Get root dependencies
        run: flutter pub get

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze root package
        run: flutter analyze

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run all tests
        run: |
          flutter test --reporter=expanded > test_results.log 2>&1 || {
            echo "::error title=Test Failure::Flutter test suite failed. Inspect the step summary and uploaded test-results-log artifact for details."
            echo "### ❌ Flutter Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_results.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 test_results.log
            exit 1
          }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: test_results.log
          if-no-files-found: ignore

      - name: Build example Flutter Web JavaScript release
        working-directory: example
        run: flutter build web --release

      - name: Build example Flutter Web WebAssembly release
        working-directory: example
        run: flutter build web --release --wasm

      - name: Run MetaMantle doctor
        working-directory: example
        run: dart run meta_mantle:meta_mantle doctor --config meta_mantle.config.json

      - name: Validate example configuration
        working-directory: example
        run: dart run meta_mantle:meta_mantle validate --config meta_mantle.config.json

      - name: Execute MetaMantle build-web command
        working-directory: example
        run: dart run meta_mantle:meta_mantle build-web --mode prerender --strict --release

      - name: Validate generated route-specific HTML
        working-directory: example
        run: dart run meta_mantle:meta_mantle html validate --dir build/web --strict

      - name: Audit generated SEO and metadata report
        working-directory: example
        run: dart run meta_mantle:meta_mantle report --dir build/web

      - name: Upload web build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts-on-failure
          path: example/build/web
          if-no-files-found: ignore

      - name: Verify package publish dry-run
        run: dart pub publish --dry-run
