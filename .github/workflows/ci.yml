name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build and verify browser example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release
          flutter build web --release --wasm
          dart run meta_mantle:meta_mantle doctor --config meta_mantle.config.json
          dart run meta_mantle:meta_mantle build --config meta_mantle.config.json --input build/web --output build/web --strict
      - run: dart pub publish --dry-run
